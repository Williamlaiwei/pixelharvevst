[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelharvest"
version = "0.1.0"
description = "Configurable image acquisition with streaming validation and resumable processing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PixelHarvest contributors"}]
dependencies = [
  "httpx>=0.28,<0.29", "beautifulsoup4>=4.12,<5", "lxml>=5,<7",
  "numpy>=2,<3", "Pillow>=11.3,<14", "ImageHash>=4.3,<5", "PyYAML>=6,<7",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.2,<2", "pip-licenses>=5,<6", "setuptools>=77,<84", "wheel>=0.45,<1"]

[project.scripts]
pixelharvest = "pixelharvest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: local HTTP or browser integration tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
