name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pixelharvest/browsers
      PIXELHARVEST_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check src tests examples benchmarks scripts
      - run: python -m ruff format --check src tests examples benchmarks scripts
      - run: python -m pytest -m "not integration" -q
      - run: python -m pytest -m integration -q
      - run: python scripts/scan_secrets.py
      - run: python -m build --no-isolation
